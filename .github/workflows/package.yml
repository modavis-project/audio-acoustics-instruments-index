name: Package tagged release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.13.13"
          enable-cache: true
      - name: Install validation dependencies
        run: uv sync --frozen --extra validation
      - run: make build validate
      - name: Package archive
        run: |
          mkdir -p release
          git archive --format=zip --prefix=audio-acoustics-instruments-index-${GITHUB_REF_NAME}/ --output=release/audio-acoustics-instruments-index-${GITHUB_REF_NAME}.zip HEAD
          cd release && sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: release/
