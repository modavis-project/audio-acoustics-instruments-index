name: Preview GitHub metadata refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.13.13"
          enable-cache: true
      - name: Install validation dependencies
        run: uv sync --frozen --extra validation
      - name: Refresh public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: make refresh
      - name: Build and validate preview
        run: make build validate
      - uses: actions/upload-artifact@v4
        with:
          name: github-metadata-refresh-preview
          path: |
            data/github-snapshot.jsonl
            exports/
            knowledge/
